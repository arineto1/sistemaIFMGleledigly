<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulado: Lei nº 12.772/2012 – Carreira EBTT (IFMG)</title>
  <style>
    :root {
      --bg-page: #fbfbf9;
      --bg-surface: #ffffff;
      --text-main: #24292f;
      --text-secondary: #4a5568;
      --border-color: #e2e8f0;
      --primary: #1e3a5f;
      --primary-light: #eaf1f8;
      --correct-bg: #ecfdf5;
      --correct-border: #10b981;
      --correct-text: #065f46;
      --wrong-bg: #fef2f2;
      --wrong-border: #ef4444;
      --wrong-text: #991b1b;
      --neutral-highlight: #f8fafc;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      letter-spacing: -0.01em;
      padding: 32px 16px 80px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    header {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 28px;
      box-shadow: var(--shadow-sm);
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      background-color: var(--primary-light);
      color: var(--primary);
      margin-bottom: 12px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .progress-bar-container {
      margin-top: 18px;
      background: #edf2f7;
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: var(--primary);
      width: 0%;
      height: 100%;
      transition: width 0.3s ease;
    }

    .question-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 26px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s ease;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 10px;
    }

    .question-number {
      font-weight: 700;
      font-size: 15px;
      color: var(--primary);
    }

    .question-status {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
    }

    .question-text {
      font-size: 16px;
      color: #1e293b;
      margin-bottom: 20px;
      white-space: pre-line;
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-label {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      background-color: #ffffff;
      transition: all 0.2s ease;
      font-size: 15px;
      line-height: 1.55;
      user-select: none;
    }

    .option-label:hover {
      background-color: #f8fafc;
      border-color: #cbd5e1;
    }

    .option-label input[type="radio"] {
      margin-top: 4px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .option-label.selected {
      background-color: #f1f5f9;
      border-color: var(--primary);
    }

    /* Pós-correção */
    .option-label.is-correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text) !important;
      font-weight: 600;
    }

    .option-label.is-wrong {
      background-color: var(--wrong-bg) !important;
      border-color: var(--wrong-border) !important;
      color: var(--wrong-text) !important;
    }

    .resolution-box {
      display: none;
      margin-top: 22px;
      padding: 20px;
      border-radius: 8px;
      background-color: #f8fafc;
      border-left: 4px solid var(--primary);
      border-top: 1px solid #e2e8f0;
      border-right: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
      animation: fadeIn 0.4s ease;
    }

    .resolution-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .resolution-badge {
      font-size: 13px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      background-color: var(--primary);
      color: #fff;
    }

    .resolution-ref {
      font-size: 13px;
      color: #64748b;
      font-style: italic;
    }

    .resolution-content {
      font-size: 15px;
      color: #334155;
      line-height: 1.65;
    }

    .actions-bar {
      margin-top: 32px;
      text-align: center;
    }

    .btn-submit {
      background-color: var(--primary);
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      padding: 16px 36px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-submit:hover {
      background-color: #152942;
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .btn-reset {
      display: none;
      margin: 16px auto 0;
      background-color: transparent;
      color: #475569;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 20px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-reset:hover {
      background-color: #f1f5f9;
      color: #0f172a;
    }

    /* Quadro de Resultados */
    .result-dashboard {
      display: none;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 28px;
      margin-top: 32px;
      box-shadow: var(--shadow-md);
      animation: fadeIn 0.4s ease;
    }

    .score-title {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
      text-align: center;
    }

    .score-metric {
      font-size: 40px;
      font-weight: 800;
      color: var(--primary);
      text-align: center;
      margin-bottom: 8px;
    }

    .score-detail {
      text-align: center;
      color: var(--text-secondary);
      font-size: 15px;
      margin-bottom: 24px;
    }

    .gabarito-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .gabarito-item {
      background-color: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      font-size: 13px;
    }

    .gabarito-item strong {
      display: block;
      color: #1e293b;
      font-size: 14px;
    }

    .badge-status {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      margin-top: 4px;
    }

    .badge-status.hit {
      background: #dcfce7;
      color: #166534;
    }

    .badge-status.miss {
      background: #fee2e2;
      color: #991b1b;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      body { padding: 16px 8px 60px; }
      header, .question-card, .result-dashboard { padding: 18px; }
      h1 { font-size: 20px; }
      .btn-submit { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <span class="badge">Legislação Federal Aplicada • Concurso IFMG</span>
      <h1>Simulado: Lei nº 12.772/2012</h1>
      <p class="subtitle">
        Ingresso, Classes e Desenvolvimento na Carreira de Magistério EBTT (Capítulos I, II e III).
        Responda às 10 questões e, ao finalizar, consulte o relatório de acertos e a resolução comentada na íntegra.
      </p>
      <div class="progress-bar-container">
        <div id="progressBar" class="progress-bar-fill"></div>
      </div>
    </header>

    <form id="quizForm">
      <div id="questionsContainer"></div>

      <div class="actions-bar">
        <button type="button" id="btnSubmit" class="btn-submit" onclick="avaliarSimulado()">Finalizar Simulado e Ver Resoluções</button>
        <button type="button" id="btnReset" class="btn-reset" onclick="reiniciarSimulado()">Refazer Simulado</button>
      </div>
    </form>

    <section id="resultDashboard" class="result-dashboard">
      <h2 class="score-title">Desempenho Geral</h2>
      <div id="scoreMetric" class="score-metric">0/10</div>
      <p id="scoreDetail" class="score-detail"></p>
      <div class="gabarito-grid" id="gabaritoGrid"></div>
    </section>
  </div>

  <script>
    const questoesData = [
      {
        id: 1,
        enunciado: "No que concerne às diretrizes gerais do Plano de Carreiras e Cargos de Magistério Federal e às atividades atribuídas aos docentes da Carreira de Magistério do Ensino Básico, Técnico e Tecnológico (EBTT), disciplinadas nos arts. 1º e 2º da Lei nº 12.772/2012, analise as afirmativas a seguir:\n\nI. As atribuições do cargo de Professor da Carreira EBTT restringem-se estritamente à regência de aulas no âmbito da educação básica e tecnológica, sendo vedada a contabilização de atividades de gestão institucional para o cômputo de suas obrigações funcionais ordinárias.\nII. As atividades de pesquisa aplicada e de extensão comunitária integram legalmente o rol de atribuições dos cargos docentes, assim como as ações inerentes ao exercício de direção, assessoramento, chefia, coordenação e assistência na própria instituição federal de ensino.\nIII. O Plano de Carreiras e Cargos de Magistério Federal é integrado pela Carreira de Magistério Superior, pela Carreira de Magistério do Ensino Básico, Técnico e Tecnológico e pelos correspondentes Cargos Isolados de Professor Titular-Livre.\n\nEstá correto o que se afirma em:",
        opcoes: [
          { letra: "A", texto: "I, apenas." },
          { letra: "B", texto: "I e II, apenas." },
          { letra: "C", texto: "II e III, apenas." },
          { letra: "D", texto: "I e III, apenas." },
          { letra: "E", texto: "I, II e III." }
        ],
        correta: "C",
        dispositivo: "Lei nº 12.772/2012, arts. 1º, § 1º, II e IV, e 2º",
        resolucao: "A alternativa C é a correta porque contempla a exata consonância com o ordenamento infraconstitucional estabelecido nos artigos 1º e 2º da Lei nº 12.772/2012.\n\nO art. 2º da mencionada lei define expressamente que as atividades das Carreiras e Cargos Isolados do Plano de Carreiras e Cargos de Magistério Federal abrangem não apenas o ensino regular em sala de aula, mas também atividades essenciais e indissociáveis relacionadas à pesquisa científica ou aplicada e à extensão universitária ou tecnológica. Além disso, a norma inclui de forma expressa no escopo funcional as ações inerentes ao exercício de funções diretivas, comissões de coordenação, assessoramento, assistência e chefia no âmbito da própria instituição federal de ensino, bem como outras atribuições previstas em legislação setorial específica. Tal conformação legal invalida a afirmativa I, cujo teor restringia indevidamente a atuação docente à docência pura em salas de aula e vedava o aproveitamento de atividades de gestão.\n\nPor sua vez, a afirmativa II espelha o texto normativo do citado art. 2º ao assegurar a plena integração das atividades de pesquisa, extensão e gestão administrativa na carreira docente.\n\nA afirmativa III retrata com exatidão o mandamento do art. 1º da Lei nº 12.772/2012, o qual estrutura o Plano de Carreiras e Cargos de Magistério Federal mediante a conjugação de dois ramos basilares: a Carreira de Magistério Superior e a Carreira de Magistério do Ensino Básico, Técnico e Tecnológico (EBTT), com seus respectivos Cargos Isolados de provimento efetivo denominados Professor Titular-Livre do Magistério Superior e Professor Titular-Livre do Ensino Básico, Técnico e Tecnológico."
      },
      {
        id: 2,
        enunciado: "Em relação ao regramento jurídico do ingresso nos cargos de provimento efetivo da Carreira de Magistério do Ensino Básico, Técnico e Tecnológico, conforme previsto no art. 10 da Lei nº 12.772/2012, assinale a alternativa INCORRETA:",
        opcoes: [
          { letra: "A", texto: "O ingresso nos cargos de provimento efetivo da Carreira de Magistério EBTT dar-se-á, obrigatoriamente, no nível inicial de vencimento da classe de ingresso da carreira." },
          { letra: "B", texto: "O concurso público de provas e títulos constitui o instrumento legal compulsório para o provimento originário do cargo de Professor da Carreira EBTT." },
          { letra: "C", texto: "No concurso público destinado ao ingresso na Carreira EBTT, a legislação federal exige a comprovação de conclusão de curso superior em nível de graduação." },
          { letra: "D", texto: "Havendo justificada carência de pessoal em áreas técnicas estratégicas, o Conselho Superior do Instituto Federal poderá autorizar a investidura de candidatos diretamente nas classes intermediárias da carreira." },
          { letra: "E", texto: "Os cargos de provimento efetivo de Professor da Carreira EBTT destinam-se a suprir os quadros permanentes das Instituições Federais de Ensino vinculadas ao Ministério da Educação ou ao Ministério da Defesa." }
        ],
        correta: "D",
        dispositivo: "Lei nº 12.772/2012, art. 10",
        resolucao: "A alternativa D é a opção incorreta exigida pelo enunciado.\n\nO princípio da acessibilidade aos cargos públicos mediante concurso público (art. 37, inciso II, da Constituição Federal) e a estrutura delineada no art. 10 da Lei nº 12.772/2012 impõem que o ingresso na Carreira de Magistério EBTT ocorra de forma inderrogável no primeiro nível da classe de ingresso da carreira (Classe A, Nível 1). A legislação federal de regência não confere competência a Conselhos Superiores ou dirigentes máximos das Instituições Federais de Ensino para criar exceções, autorizar provimentos em classes intermediárias ou proceder a investiduras derivadas. Qualquer ingresso em classes subsequentes à classe inicial implicaria transgressão formal ao princípio republicano e à regra do concurso público específico para a carreira, tornando nulo o provimento.\n\nAs demais alternativas encontram respaldo na lei: a alternativa A reitera o comando expresso do art. 10 de que o início da trajetória docente dá-se sempre na base da carreira; a alternativa B confirma a necessidade de realização de certame na modalidade de provas e títulos; a alternativa C reproduz a previsão do § 1º do art. 10, que elege a conclusão de curso superior em nível de graduação devidamente registrado como a formação acadêmica mínima requerida para a posse no cargo efetivo de docente EBTT; e a alternativa E confirma o art. 1º, § 5º e § 6º, da norma, ao apontar que tais cargos integram o quadro de pessoal permanente das entidades públicas federais de ensino submetidas aos órgãos federais superiores."
      },
      {
        id: 3,
        enunciado: "O art. 14 da Lei nº 12.772/2012 delimita com precisão os instrumentos técnicos que consubstanciam o desenvolvimento na Carreira de Magistério do Ensino Básico, Técnico e Tecnológico. Segundo as balizas conceituais e estruturais fixadas na referida lei, a passagem do servidor docente para o nível de vencimento imediatamente superior dentro de uma mesma classe e a movimentação funcional do docente de uma classe para outra subsequente denominam-se, respectivamente:",
        opcoes: [
          { letra: "A", texto: "Promoção e Progressão funcional." },
          { letra: "B", texto: "Progressão funcional e Promoção." },
          { letra: "C", texto: "Ascensão funcional e Transferência." },
          { letra: "D", texto: "Transposição e Promoção por merecimento." },
          { letra: "E", texto: "Readaptação acadêmica e Aceleração do desenvolvimento." }
        ],
        correta: "B",
        dispositivo: "Lei nº 12.772/2012, art. 14, § 1º",
        resolucao: "A alternativa B é a correta.\n\nO regime de desenvolvimento funcional instituído pela Lei nº 12.772/2012 para a Carreira de Magistério do Ensino Básico, Técnico e Tecnológico baseia-se na separação técnica e objetiva entre dois institutos principais, definidos no art. 14:\n• A progressão funcional, classificada como o avanço horizontal do docente, representa a movimentação de um nível de vencimento para o nível imediatamente superior situado dentro dos limites de uma mesma classe;\n• A promoção funcional, de natureza vertical, caracteriza a passagem definitiva do docente de um patamar funcional para outro, ocorrendo mediante a transposição do último nível de vencimento de uma classe para o nível inicial da classe subsequente.\n\nAs alternativas A, C, D e E utilizam terminologias inaplicáveis ou expressamente banidas do direito administrativo disciplinador das carreiras públicas federais. O termo 'ascensão funcional' foi expurgado da ordem jurídica por afronta ao art. 37, II, da Constituição Federal (Súmula Vinculante nº 43/STF); por sua vez, institutos como transferência, transposição ou readaptação disciplinam realidades administrativas distintas e não se confundem com os critérios operacionais da progressão e da promoção docente."
      },
      {
        id: 4,
        enunciado: "Considere que um docente tomou posse e entrou em efetivo exercício no cargo de Professor da Carreira EBTT em determinado campus do Instituto Federal de Minas Gerais (IFMG). Cumpridas as tarefas letivas e acadêmicas inerentes ao cargo, o docente manifesta interesse em obter sua evolução para o nível subsequente de vencimento da mesma classe em que se encontra posicionado.\n\nDe acordo com as condicionantes normativas delineadas no art. 14 da Lei nº 12.772/2012 para a concessão da progressão funcional, o docente deverá satisfazer, cumulativamente, os seguintes requisitos:",
        opcoes: [
          { letra: "A", texto: "Cumprimento do interstício mínimo de 12 (doze) meses de efetivo exercício no nível e obtenção de nota mínima em avaliação de desempenho individual." },
          { letra: "B", texto: "Cumprimento do interstício temporal de 24 (vinte e quatro) meses de efetivo exercício em cada nível e aprovação em processo de avaliação de desempenho individual." },
          { letra: "C", texto: "Permanência no nível pelo interstício de 36 (trinta e seis) meses de efetivo exercício e necessária conclusão de curso de pós-graduação lato sensu." },
          { letra: "D", texto: "Cumprimento do interstício de 24 (vinte e quatro) meses no nível funcional e defesa oral de memorial descritivo perante banca examinadora externa." },
          { letra: "E", texto: "Integralização do tempo de serviço de 18 (dezoito) meses no nível funcional, prescindindo de processo formal de avaliação de desempenho individual." }
        ],
        correta: "B",
        dispositivo: "Lei nº 12.772/2012, art. 14, § 2º, incisos I e II",
        resolucao: "A alternativa B é a correta.\n\nO art. 14, § 2º, incisos I e II, da Lei nº 12.772/2012 define com absoluta precisão os requisitos para a concessão da progressão funcional horizontal entre os níveis de uma mesma classe na Carreira EBTT. Para fazer jus à mudança de padrão remuneratório, o legislador exige o preenchimento cumulativo de duas condições objetivas de elegibilidade:\n1. O cumprimento do interstício temporal mínimo de 24 (vinte e quatro) meses de efetivo exercício no nível funcional antecedente;\n2. A aprovação formal em processo de avaliação de desempenho individual, demonstrando a regularidade e a qualidade do trabalho acadêmico no período correspondente.\n\nAs opções A e E estão erradas por apontarem prazos não amparados na Lei nº 12.772/2012 (12 meses e 18 meses, respectivamente) para as progressões regulares de nível na Carreira EBTT. A alternativa C erra ao estipular um prazo de 36 meses para uma progressão funcional ordinária e ao exigir pós-graduação como condicionante de nível. A alternativa D erra por impor a defesa de memorial perante comissão externa como exigência de progressão de nível, circunstância processual que a lei reserva com exclusividade para o processo de promoção ao ápice da carreira (Classe Titular)."
      },
      {
        id: 5,
        enunciado: "No que se refere às disposições legais concernentes à promoção funcional (passagem de uma classe para a subsequente) no âmbito da Carreira de Magistério EBTT, previstas no art. 14 da Lei nº 12.772/2012, assinale a afirmativa correta:",
        opcoes: [
          { letra: "A", texto: "A promoção funcional para qualquer classe da Carreira prescinde do cumprimento do interstício temporal no último nível da classe antecedente se o docente apresentar nova titulação acadêmica." },
          { letra: "B", texto: "O alcance da estabilidade ao término do estágio probatório gera, de forma automática e independentemente de avaliação, a promoção direta do docente para a Classe Titular da carreira." },
          { letra: "C", texto: "A promoção funcional de uma classe para a imediatamente subsequente exige o cumprimento do interstício temporal fixado em lei no último nível da classe antecedente e a prévia aprovação em processo de avaliação de desempenho individual." },
          { letra: "D", texto: "O processo avaliativo destinado a validar a promoção funcional docente compete de forma exclusiva a avaliadores independentes designados pela Secretaria de Educação Profissional e Tecnológica (SETEC/MEC)." },
          { letra: "E", texto: "O exercício de funções de coordenação de curso e direção na instituição acarreta a suspensão do cômputo temporal necessário para a aquisição do direito à promoção funcional." }
        ],
        correta: "C",
        dispositivo: "Lei nº 12.772/2012, art. 14, § 3º",

    let userAnswers = {};
    let isSubmitted = false;

    function renderQuiz() {
      const container = document.getElementById("questionsContainer");
      container.innerHTML = "";

      questoesData.forEach((q) => {
        const card = document.createElement("article");
        card.className = "question-card";
        card.id = `qCard_${q.id}`;

        const optionsHtml = q.opcoes.map((opt) => `
          <label class="option-label" id="optLabel_${q.id}_${opt.letra}">
            <input type="radio" name="question_${q.id}" value="${opt.letra}" onchange="selectOption(${q.id}, '${opt.letra}')">
            <span><strong>${opt.letra})</strong> ${opt.texto}</span>
          </label>
        `).join("");

        card.innerHTML = `
          <div class="question-header">
            <span class="question-number">Questão ${String(q.id).padStart(2, "0")}</span>
            <span class="question-status" id="qStatus_${q.id}">Pendente</span>
          </div>
          <div class="question-text">${q.enunciado}</div>
          <div class="options-group">
            ${optionsHtml}
          </div>
          <div class="resolution-box" id="resBox_${q.id}">
            <div class="resolution-header">
              <span class="resolution-badge">Gabarito: ${q.correta}</span>
              <span class="resolution-ref">${q.dispositivo}</span>
            </div>
            <div class="resolution-content">${q.resolucao.replace(/\n\n/g, '<br><br>').replace(/\n•/g, '<br>•')}</div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function selectOption(qId, letra) {
      if (isSubmitted) return;

      userAnswers[qId] = letra;

      // Atualiza estilo da seleção
      const q = questoesData.find(item => item.id === qId);
      q.opcoes.forEach(opt => {
        const lbl = document.getElementById(`optLabel_${qId}_${opt.letra}`);
        if (opt.letra === letra) {
          lbl.classList.add("selected");
        } else {
          lbl.classList.remove("selected");
        }
      });

      const statusElem = document.getElementById(`qStatus_${qId}`);
      statusElem.textContent = "Respondida";
      statusElem.style.color = "var(--primary)";

      updateProgressBar();
    }

    function updateProgressBar() {
      const answeredCount = Object.keys(userAnswers).length;
      const pct = (answeredCount / questoesData.length) * 100;
      document.getElementById("progressBar").style.width = `${pct}%`;
    }

    function avaliarSimulado() {
      const totalRespondidas = Object.keys(userAnswers).length;
      if (totalRespondidas < questoesData.length) {
        const faltantes = questoesData.length - totalRespondidas;
        const confirma = confirm(`Você respondeu ${totalRespondidas} de ${questoesData.length} questões. Deseja finalizar o simulado mesmo com ${faltantes} questão(ões) em branco?`);
        if (!confirma) return;
      }

      isSubmitted = true;
      let acertos = 0;
      const gabaritoGrid = document.getElementById("gabaritoGrid");
      gabaritoGrid.innerHTML = "";

      questoesData.forEach((q) => {
        const userChoice = userAnswers[q.id] || null;
        const acertou = userChoice === q.correta;
        if (acertou) acertos++;

        // Desabilita os inputs
        const radios = document.getElementsByName(`question_${q.id}`);
        radios.forEach(r => r.disabled = true);

        // Marcações visuais nas alternativas
        q.opcoes.forEach(opt => {
          const lbl = document.getElementById(`optLabel_${q.id}_${opt.letra}`);
          lbl.style.cursor = "default";
          
          if (opt.letra === q.correta) {
            lbl.classList.add("is-correct");
          }
          if (userChoice && opt.letra === userChoice && !acertou) {
            lbl.classList.add("is-wrong");
          }
        });

        // Atualiza status da questão
        const statusElem = document.getElementById(`qStatus_${q.id}`);
        if (acertou) {
          statusElem.textContent = "Acertou ✓";
          statusElem.style.color = "var(--correct-border)";
        } else {
          statusElem.textContent = userChoice ? "Errou ✗" : "Em branco ✗";
          statusElem.style.color = "var(--wrong-border)";
        }

        // Revela a caixa de resolução na íntegra
        const resBox = document.getElementById(`resBox_${q.id}`);
        resBox.style.display = "block";

        // Adiciona ao card resumo do gabarito
        const item = document.createElement("div");
        item.className = "gabarito-item";
        item.innerHTML = `
          <strong>Q${String(q.id).padStart(2, '0')}: ${q.correta}</strong>
          <div>Marcou: ${userChoice || "—"}</div>
          <span class="badge-status ${acertou ? 'hit' : 'miss'}">${acertou ? 'ACERTO' : 'ERRO'}</span>
        `;
        gabaritoGrid.appendChild(item);
      });

      // Exibe painel de resultado
      const dashboard = document.getElementById("resultDashboard");
      dashboard.style.display = "block";

      const pctAcertos = Math.round((acertos / questoesData.length) * 100);
      document.getElementById("scoreMetric").textContent = `${acertos} / ${questoesData.length}`;
      
      let msg = `Aproveitamento: ${pctAcertos}%. `;
      if (pctAcertos >= 80) {
        msg += "Excelente desempenho! Domínio sólido dos arts. 1º a 15-A da Lei nº 12.772/2012.";
      } else if (pctAcertos >= 60) {
        msg += "Bom aproveitamento. Revise os pontos comentados nas resoluções para consolidar as nuances da carreira EBTT.";
      } else {
        msg += "Recomenda-se leitura atenta das resoluções comentadas abaixo para fixar os critérios de progressão e promoção.";
      }
      document.getElementById("scoreDetail").textContent = msg;

      // Ajusta botões
      document.getElementById("btnSubmit").style.display = "none";
      document.getElementById("btnReset").style.display = "inline-block";

      // Rola suavemente até o resultado
      dashboard.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function reiniciarSimulado() {
      userAnswers = {};
      isSubmitted = false;
      document.getElementById("quizForm").reset();
      document.getElementById("resultDashboard").style.display = "none";
      document.getElementById("btnSubmit").style.display = "inline-block";
      document.getElementById("btnReset").style.display = "none";
      document.getElementById("progressBar").style.width = "0%";
      renderQuiz();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // Inicialização
    document.addEventListener("DOMContentLoaded", () => {
      renderQuiz();
    });
  </script>
